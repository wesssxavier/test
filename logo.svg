<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 290" aria-label="Company Crest">
  <defs>
    <style>
      .stroke { fill: none; stroke: #1a2a5e; stroke-linejoin: round; stroke-linecap: round; }
      .fill { fill: #1a2a5e; }
    </style>
  </defs>

  <!-- Outer scalloped shield -->
  <path class="stroke" stroke-width="5" d="
    M 28 60
    C 28 40, 42 28, 56 38
    C 64 30, 78 30, 86 40
    C 94 28, 106 28, 114 40
    L 120 34
    L 126 40
    C 134 28, 146 28, 154 40
    C 162 30, 176 30, 184 38
    C 198 28, 212 40, 212 60
    L 212 180
    C 212 218, 188 246, 120 276
    C 52 246, 28 218, 28 180
    Z
  "/>

  <!-- Inner shield outline -->
  <path class="stroke" stroke-width="1.6" d="
    M 40 66
    C 40 50, 52 44, 62 52
    C 70 46, 82 46, 90 54
    C 98 46, 108 46, 116 54
    L 120 50
    L 124 54
    C 132 46, 142 46, 150 54
    C 158 46, 170 46, 178 52
    C 188 44, 200 50, 200 66
    L 200 176
    C 200 208, 180 232, 120 260
    C 60 232, 40 208, 40 176
    Z
  "/>

  <!-- Top finial ornament -->
  <path class="stroke" stroke-width="1.4" d="M 114 52 Q 120 44 126 52"/>
  <circle class="fill" cx="120" cy="48" r="1.6"/>
  <path class="stroke" stroke-width="1.2" d="M 108 60 Q 120 53 132 60"/>
  <path class="stroke" stroke-width="1" d="M 102 66 Q 120 60 138 66"/>

  <!-- Left scrollwork flourishes -->
  <path class="stroke" stroke-width="1.2" d="M 58 78 C 48 84, 46 96, 56 102 C 62 104, 68 98, 64 92"/>
  <path class="stroke" stroke-width="1" d="M 74 86 C 66 92, 68 102, 76 104"/>
  <path class="stroke" stroke-width="1.2" d="M 52 112 C 44 120, 46 132, 56 136 C 62 138, 66 132, 62 126"/>
  <path class="stroke" stroke-width="1" d="M 48 146 C 42 154, 46 164, 54 166"/>
  <path class="stroke" stroke-width="1.2" d="M 56 174 C 48 182, 50 194, 58 198 C 64 200, 68 192, 64 186"/>
  <path class="stroke" stroke-width="1" d="M 60 204 C 54 212, 58 222, 66 224"/>

  <!-- Right scrollwork flourishes (mirror) -->
  <path class="stroke" stroke-width="1.2" d="M 182 78 C 192 84, 194 96, 184 102 C 178 104, 172 98, 176 92"/>
  <path class="stroke" stroke-width="1" d="M 166 86 C 174 92, 172 102, 164 104"/>
  <path class="stroke" stroke-width="1.2" d="M 188 112 C 196 120, 194 132, 184 136 C 178 138, 174 132, 178 126"/>
  <path class="stroke" stroke-width="1" d="M 192 146 C 198 154, 194 164, 186 166"/>
  <path class="stroke" stroke-width="1.2" d="M 184 174 C 192 182, 190 194, 182 198 C 176 200, 172 192, 176 186"/>
  <path class="stroke" stroke-width="1" d="M 180 204 C 186 212, 182 222, 174 224"/>

  <!-- Bottom scrollwork -->
  <path class="stroke" stroke-width="1.2" d="M 82 226 C 90 234, 102 236, 110 228"/>
  <path class="stroke" stroke-width="1.2" d="M 158 226 C 150 234, 138 236, 130 228"/>
  <path class="stroke" stroke-width="1" d="M 92 238 C 102 246, 118 246, 120 238 C 122 246, 138 246, 148 238"/>
  <path class="stroke" stroke-width="1" d="M 104 248 Q 120 254, 136 248"/>

  <!-- Central monogram "JB" — intertwined blackletter-style serif -->
  <g fill="#1a2a5e" font-family="Cormorant Garamond, Didot, 'Times New Roman', serif" font-weight="700" font-style="italic" text-anchor="middle">
    <text x="120" y="190" font-size="135" letter-spacing="-22">JB</text>
  </g>

  <!-- Decorative flourish at the top of the J -->
  <path class="stroke" stroke-width="1.5" d="M 92 98 Q 86 90 92 82 Q 98 86 96 94"/>
  <!-- Decorative flourish at the tail of the J/B -->
  <path class="stroke" stroke-width="1.5" d="M 100 204 Q 104 214 114 212 Q 116 206 110 202"/>
  <path class="stroke" stroke-width="1.5" d="M 140 204 Q 136 214 126 212"/>
</svg>
